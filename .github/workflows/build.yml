name: Build ESP32 Plant Care Firmware

on:
  push:
    branches:
      - main
    paths:
      - '*.ino'
      
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Arduino-cli
      run: |
        # Arduino-Cli Debian package
        sudo apt update
        sudo apt install git wget -y
        wget -O arduino-cli.deb https://github.com/xiv3r/arduino-cli/releases/download/arduino-cli/arduino-cli.deb
        sudo dpkg -i arduino-cli.deb
        sudo apt --fix-broken install -y
        sudo dpkg --configure -a

        arduino-cli config init
        arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install esp32:esp32

        # Install libraries
        arduino-cli lib install "DHT22"
        arduino-cli lib install "DHT sensor library"
        arduino-cli lib install "Adafruit Unified Sensor"
        
        # Compile firmware
        mv *.ino esp32-plant-care.ino
        arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=noota_ffat --output-dir firmware .

        # Rename
        mv firmware/*.ino.merged.bin      firmware/esp32-plant-care-0x0.bin
        mv firmware/esp32-plant-care-0x0.bin .

    - name: Commit firmware binary
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git pull --rebase --autostash origin main
        git add -f *.bin
        git commit -m "chore: update firmware binary [skip ci]" || echo "No changes to commit"
        git push origin HEAD:main
