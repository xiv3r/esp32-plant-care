name: Build ESP32 Plant Care Firmware

on:
  push:
    branches:
      - main
    paths:
      - '*.ino'
      
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Arduino-cli
      run: |        
        # Arduino-Cli Debian package
        sudo apt update 
        sudo apt install git wget -y
        wget -O arduino-cli.deb https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1-1_amd64.deb
        sudo dpkg -i arduino-cli.deb
        sudo apt --fix-broken install -y
        sudo dpkg --configure -a
        
        arduino-cli config init
        arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install esp32:esp32
        
        # Install libraries
        arduino-cli lib install "DHT22"
        arduino-cli lib install "DHT sensor library"
        arduino-cli lib install "Adafruit Unified Sensor"
        arduino-cli lib install "AsyncTCP"
        arduino-cli lib install "ESPAsyncWebServer"
        
        # Compile firmware
        arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir firmware .
        
        # Rename
        rm firmware/*.ino.bin             
        rm firmware/*.ino.bootloader.bin  
        rm firmware/*.ino.partitions.bin
        
        mv firmware/*.ino.merged.bin      firmware/esp32-plant-care-0x0.bin
        
    - name: Determine release tag
      id: get_tag
      run: |
        if [ "${{ github.event_name }}" == "release" ]; then
          TAG_NAME="${{ github.event.release.tag_name }}"
        else
          TAG_NAME="v.1"
        fi
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

    - name: Upload files to existing release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.get_tag.outputs.tag_name }}
        files: |
          firmware/*.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
