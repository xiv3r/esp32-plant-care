name: Build ESP32 MULTI Firmware

on:
  push:
    branches:
      - main
    paths:
      - 'ESP32-MULTI/*.ino'
      
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Arduino-cli
      run: |
        # Arduino-Cli Debian package
        sudo apt update
        sudo apt install git wget -y
        wget -O arduino-cli.deb https://github.com/xiv3r/arduino-cli/releases/download/arduino-cli/arduino-cli.deb
        sudo dpkg -i arduino-cli.deb
        sudo apt --fix-broken install -y
        sudo dpkg --configure -a

        arduino-cli config init
        arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install esp32:esp32@2.0.17

        # Libraries 
        arduino-cli lib install "Adafruit SSD1306"
        arduino-cli lib install "Adafruit GFX Library"
        arduino-cli lib install "Adafruit BusIO"
        arduino-cli lib install "Adafruit BME280 Library"
        arduino-cli lib install "Adafruit Unified Sensor"
        arduino-cli lib install "BH1750"
        arduino-cli lib install "ESPAsyncWebServer"
        arduino-cli lib install "AsyncTCP"
        arduino-cli lib install "ArduinoJson"
        
        # Compile firmware
        cd ESP32-MULTI
        mv *.ino ESP32-MULTI.ino
        arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=noota_ffat --output-dir firmware .

        # Rename
        mv firmware/*.ino.merged.bin      firmware/esp32-multi-0x0.bin
        mv firmware/esp32-multi-0x0.bin .

    - name: Commit firmware binary
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git pull --rebase --autostash origin main
        git add -f ESP32-MULTI/*.bin
        git commit -m "chore: update firmware binary [skip ci]" || echo "No changes to commit"
        git push origin HEAD:main
