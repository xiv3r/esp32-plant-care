name: Build ESP32 WEATHER Firmware

on:
  push:
    branches:
      - main
    paths:
      - 'ESP32-WEATHER/*.ino'
      
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Arduino-cli
      run: |        
        # Arduino-Cli Debian package
        sudo apt update 
        sudo apt install git wget -y
        wget -O arduino-cli.deb https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1-1_amd64.deb
        sudo dpkg -i arduino-cli.deb
        sudo apt --fix-broken install -y
        sudo dpkg --configure -a
        
        arduino-cli config init
        arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install esp32:esp32

        # Compile firmware
        cd ESP32-WEATHER
        mv *.ino ESP32-WEATHER.ino
        arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir firmware .
        
        # Rename
        rm firmware/*.ino.bin             
        rm firmware/*.ino.bootloader.bin  
        rm firmware/*.ino.partitions.bin
        
        mv firmware/*.ino.merged.bin      firmware/esp32-weather-0x0.bin
        mv firmware/*.bin .
        
    - name: Commit firmware binary
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -f ESP32-WEATHER/*.bin
        git commit -m "chore: update firmware binary [skip ci]" || echo "No changes to commit"
        git push
